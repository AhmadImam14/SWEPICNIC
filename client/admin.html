<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | SWE Final Year Picnic</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='32' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body { background: #f8fafc; }
      .admin-shell { max-width: 1200px; margin: 40px auto; padding: 0 20px 40px; }
      .login-box, .admin-panel { background: white; border: 1px solid #e5e7eb; border-radius: 18px; box-shadow: 0 15px 35px rgba(15,23,42,0.08); padding: 28px; }
      .admin-panel { display: none; }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin: 20px 0; }
      .stat-card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; }
      .stat-card small { color: #64748b; display:block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
      .stat-card strong { font-size: 1.8rem; color: #111827; }
      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
      th { background: #f8fafc; }
      .controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0; }
      .controls input, .controls select { flex: 1 1 180px; padding: 12px 14px; border-radius: 10px; border:1px solid #dbe2ea; }
      .logout-btn { margin-left: auto; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div id="loginBox" class="login-box">
        <h2>SWE Final Year Picnic</h2>
        <h3>Admin Login</h3>
        <form id="adminLoginForm" class="stacked-form">
          <input id="adminEmail" type="email" placeholder="Admin email" required />
          <input id="adminPassword" type="password" placeholder="Password" required />
          <button type="submit" class="primary-btn">Login</button>
        </form>
        <div id="adminMessage" class="message-box hidden"></div>
      </div>

      <div id="adminPanel" class="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap: 16px; flex-wrap: wrap;">
          <div>
            <h2>SWE FINAL YEAR PICNIC</h2>
            <h3>ADMIN DASHBOARD</h3>
          </div>
          <button id="logoutBtn" class="secondary-btn logout-btn" type="button">Logout</button>
        </div>

        <div class="stats-grid">
          <div class="stat-card"><small>Total Students</small><strong id="totalStudents">0</strong></div>
          <div class="stat-card"><small>Paid</small><strong id="paidCount">0</strong></div>
          <div class="stat-card"><small>Pending</small><strong id="pendingCount">0</strong></div>
          <div class="stat-card"><small>Unpaid</small><strong id="unpaidCount">0</strong></div>
          <div class="stat-card"><small>Total Collected</small><strong id="totalCollected">₦0</strong></div>
        </div>

        <div class="controls">
          <input id="searchInput" type="text" placeholder="Search by registration number or name" />
          <select id="statusFilter">
            <option value="">All Status</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
            <option value="unpaid">Unpaid</option>
          </select>
          <button id="importCsvBtn" class="secondary-btn" type="button">Import CSV</button>
          <button id="exportBtn" class="primary-btn" type="button">Export CSV</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Registration No</th>
              <th>Name</th>
              <th>Status</th>
              <th>Amount</th>
              <th>Reference</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const loginBox = document.getElementById('loginBox');
      const adminPanel = document.getElementById('adminPanel');
      const adminMessage = document.getElementById('adminMessage');
      const adminLoginForm = document.getElementById('adminLoginForm');
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');
      const exportBtn = document.getElementById('exportBtn');
      const importCsvBtn = document.getElementById('importCsvBtn');

      const setMessage = (text, type = 'info') => {
        adminMessage.textContent = text;
        adminMessage.className = `message-box ${type}`;
        adminMessage.classList.remove('hidden');
      };

      const getToken = () => localStorage.getItem('adminToken');

      const showDashboard = () => {
        loginBox.classList.add('hidden');
        adminPanel.style.display = 'block';
      };

      const showLogin = () => {
        adminPanel.style.display = 'none';
        loginBox.classList.remove('hidden');
      };

      const fetchJson = async (url, options = {}) => {
        const token = getToken();
        const headers = { ...(options.headers || {}) };
        if (token) headers.Authorization = `Basic ${token}`;
        const response = await fetch(url, { ...options, headers });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Request failed');
        return data;
      };

      const renderStats = (stats) => {
        document.getElementById('totalStudents').textContent = stats.totalStudents;
        document.getElementById('paidCount').textContent = stats.paid;
        document.getElementById('pendingCount').textContent = stats.pending;
        document.getElementById('unpaidCount').textContent = stats.unpaid;
        document.getElementById('totalCollected').textContent = `₦${Number(stats.totalCollected || 0).toLocaleString()}`;
      };

      const renderTable = (students) => {
        const tbody = document.getElementById('studentTableBody');
        if (!students.length) {
          tbody.innerHTML = '<tr><td colspan="6">No records found.</td></tr>';
          return;
        }

        tbody.innerHTML = students.map((student) => `
          <tr>
            <td>${student.registrationNumber}</td>
            <td>${student.name}</td>
            <td>${student.paymentStatus}</td>
            <td>₦${Number(student.amountPaid || 0).toLocaleString()}</td>
            <td>${student.paymentReference || '-'}</td>
            <td>${student.paidAt ? new Date(student.paidAt).toLocaleString() : '-'}</td>
          </tr>
        `).join('');
      };

      const loadAdminData = async () => {
        try {
          const [statsData, studentsData] = await Promise.all([
            fetchJson('/api/admin/stats'),
            fetchJson(`/api/admin/students?search=${encodeURIComponent(searchInput.value || '')}&status=${encodeURIComponent(statusFilter.value || '')}`)
          ]);
          renderStats(statsData.stats);
          renderTable(studentsData.students || []);
        } catch (error) {
          setMessage(error.message || 'Unable to load admin data.', 'error');
          localStorage.removeItem('adminToken');
          showLogin();
        }
      };

      adminLoginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.message || 'Login failed');
          localStorage.setItem('adminToken', data.token);
          showDashboard();
          await loadAdminData();
        } catch (error) {
          setMessage(error.message || 'Invalid login.', 'error');
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('adminToken');
        showLogin();
      });

      searchInput.addEventListener('input', () => loadAdminData());
      statusFilter.addEventListener('change', () => loadAdminData());
      importCsvBtn.addEventListener('click', async () => {
        try {
          importCsvBtn.disabled = true;
          importCsvBtn.textContent = 'Importing...';
          const response = await fetch('/api/admin/import-csv', {
            method: 'POST',
            headers: { Authorization: `Basic ${getToken()}` }
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.message || 'Import failed');
          setMessage(data.message || 'CSV imported successfully.', 'success');
          await loadAdminData();
        } catch (error) {
          setMessage(error.message || 'Unable to import CSV.', 'error');
        } finally {
          importCsvBtn.disabled = false;
          importCsvBtn.textContent = 'Import CSV';
        }
      });

      exportBtn.addEventListener('click', async () => {
        try {
          const token = getToken();
          const response = await fetch('/api/admin/payments', { headers: { Authorization: `Basic ${token}` } });
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'picnic-payments.csv';
          link.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          setMessage('Unable to export CSV.', 'error');
        }
      });

      if (getToken()) {
        showDashboard();
        loadAdminData();
      }
    </script>
  </body>
</html>
